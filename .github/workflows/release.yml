name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # No `publish:` here -> the action only ever opens the "Version Packages"
      # PR when changesets are pending. Publishing is gated below so routine
      # pushes don't run a no-op `pnpm publish`.
      - name: Open Version PR (when changesets are pending)
        id: cs
        uses: changesets/action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Publish ONLY when the Version Packages PR is merged into main. The
      # commit message carries the signal: a merge commit references the
      # `changeset-release/main` branch; a squash commit is titled
      # "Version Packages". Both merge styles are covered. The same step then
      # creates a GitHub Release (tag + curated notes aggregated from the
      # packages' CHANGELOG.md by scripts/release-notes.mjs).
      - name: Build, publish & tag release (only on a Version Packages merge)
        if: steps.cs.outputs.hasChangesets == 'false' && (contains(github.event.head_commit.message, 'changeset-release/main') || contains(github.event.head_commit.message, 'Version Packages'))
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm build
          pnpm -r --filter ./packages/** publish
          tag=$(node scripts/release-notes.mjs tag)
          node scripts/release-notes.mjs body > /tmp/release-notes.md
          gh release create "$tag" --title "$tag" --notes-file /tmp/release-notes.md --target "$GITHUB_SHA"
